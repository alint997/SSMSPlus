name: Build and release (SSMS 21 / 22 and SSMS 18 / 19 / 20)

# Builds the extension on every push to master / pull request (artifact only)
# and publishes a GitHub release when a tag like v7.7 is pushed:
#     git tag v7.7
#     git push origin v7.7

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (Release, SSMS 21 / 22)
        shell: cmd
        run: call build.cmd Release

      # Second build against the SSMS 20 assemblies (dist-ssms20); dist (SSMS 22) is kept.
      - name: Build (Release, SSMS 18 / 19 / 20)
        shell: cmd
        run: call build.cmd Release ssms20

      - name: Upload build artifact (SSMS 22)
        uses: actions/upload-artifact@v6
        with:
          name: SSMSPlus-ssms22
          path: |
            dist/SSMSPlus-ssms22.zip
            dist/SSMSPlus.vsix

      - name: Upload build artifact (SSMS 20)
        uses: actions/upload-artifact@v6
        with:
          name: SSMSPlus-ssms20
          path: dist-ssms20/SSMSPlus-ssms20.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: SSMS Plus ${{ github.ref_name }}
          files: |
            dist/SSMSPlus-ssms22.zip
            dist/SSMSPlus.vsix
            dist-ssms20/SSMSPlus-ssms20.zip
          body: |
            SSMS Plus for SQL Server Management Studio 21 / 22 (64-bit) and, experimental, SSMS 18 / 19 / 20.

            **Install (SSMS 21 / 22)**
            1. Download `SSMSPlus-ssms22.zip` and extract it.
            2. Close all SSMS windows.
            3. Right click `install-ssms22.cmd` > **Run as administrator**.
            4. Start SSMS: the menu is under **Tools > SSMS Plus** (to have it in the menu bar as well: Tools > Customize > Extensions Menu, clear SSMS Plus, Save and Restart).

            **Install (SSMS 18 / 19 / 20, experimental)**
            1. Download `SSMSPlus-ssms20.zip` and extract it.
            2. Close all SSMS windows.
            3. Right click `install-ssms20.cmd` > **Run as administrator** (for SSMS 19 / 18 pass the `Common7\IDE` folder as parameter).
            4. Start SSMS: **SSMS Plus** is in the menu bar.

            See the README for manual install, update and troubleshooting.
